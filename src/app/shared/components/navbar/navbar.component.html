<mat-toolbar color="primary" class="desktop-toolbar">
 
  <span><img src="../../../../assets/images/ashishsolar.webp" height="73px" width="73px"/></span>
  <span class="spacer"></span>
  
  <button mat-button routerLink="/">Home</button>
  <button mat-button routerLink="/about">About</button>
  <button mat-button routerLink="/services">Services</button>
  <button mat-button routerLink="/projects">Projects</button>
  <button mat-button routerLink="/locations">Locations</button>
  <button mat-button routerLink="/solar-calculator">Solar Calculator</button>
  <button mat-button routerLink="/testimonials">Testimonials</button>
  <button mat-button routerLink="/blog">Blog</button>
  <button mat-button routerLink="/contact">Contact</button>
  <button mat-button routerLink="/dashboard">Dashboard</button>
  <button mat-button routerLink="/admin">Admin</button>
  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="menu">
    <mat-icon>more_vert</mat-icon>
  </button>
  
  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/login">Login</button>
    <button mat-menu-item routerLink="/signup">Sign Up</button>
  </mat-menu>
</mat-toolbar>


<mat-sidenav-container class="mobile-sidenav-container" color="primary">
  <mat-sidenav #sidenav mode="over" class="sidenav" color="primary">
    <div class="sidenav-header">
      <h2>  <span><img src="../../../../assets/images/ashishsolar.webp" height="32px" width="32px"/></span></h2>
      <button mat-icon-button (click)="sidenav.close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/">Home</a>
      <a mat-list-item routerLink="/about">About</a>
      <a mat-list-item routerLink="/services">Services</a>
      <a mat-list-item routerLink="/projects">Projects</a>
      <a mat-list-item routerLink="/locations">Locations</a>
      <a mat-list-item routerLink="/solar-calculator">Solar Calculator</a>
      <a mat-list-item routerLink="/testimonials">Testimonials</a>
      <a mat-list-item routerLink="/blog">Blog</a>
      <a mat-list-item routerLink="/contact">Contact</a>
      <a mat-list-item routerLink="/dashboard">Dashboard</a>
      <a mat-list-item routerLink="/admin">Admin</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
   
    <button type="button" (click)="sidenav.toggle()" class="mobile-toggle">
      <mat-icon>menu</mat-icon> 
    </button>
    <router-outlet></router-outlet>
  </mat-sidenav-content>

</mat-sidenav-container>
