<mat-toolbar color="primary" class="desktop-toolbar">
  <span
    ><img
      src="../../../../assets/images/ashishsolar.webp"
      height="73px"
      width="73px"
  /></span>
  <span class="spacer"></span>

  <button mat-button routerLink="/home" routerLinkActive="active">Home</button>
  <button mat-button routerLink="/about" routerLinkActive="active">
    About
  </button>
  <button mat-button routerLink="/services" routerLinkActive="active">
    Services
  </button>
  <button mat-button routerLink="/projects" routerLinkActive="active">
    Projects
  </button>
  <button mat-button routerLink="/locations" routerLinkActive="active">
    Locations
  </button>
  <button mat-button routerLink="/solar-calculator" routerLinkActive="active">
    Solar Calculator
  </button>
  <button mat-button routerLink="/testimonials" routerLinkActive="active">
    Testimonials
  </button>
  <button mat-button routerLink="/blog" routerLinkActive="active">Blog</button>
  <button mat-button routerLink="/contact" routerLinkActive="active">
    Contact
  </button>
  <button mat-button routerLink="/dashboard" routerLinkActive="active">
    Dashboard
  </button>
  <button mat-button routerLink="/admin" routerLinkActive="active">
    Admin
  </button>
  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="menu">
    <mat-icon>more_vert</mat-icon>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item routerLink="/login" routerLinkActive="active">
      Login
    </button>
    <button mat-menu-item routerLink="/signup" routerLinkActive="active">
      Sign Up
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="mobile-sidenav-container" color="primary">
  <mat-sidenav #sidenav mode="over" class="sidenav" color="primary">
    <div class="sidenav-header">
      <h2>
        <span
          ><img
            src="../../../../assets/images/ashishsolar.webp"
            height="32px"
            width="32px"
        /></span>
      </h2>
      <button mat-icon-button (click)="sidenav.close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/home" routerLinkActive="active">Home</a>
      <a mat-list-item routerLink="/about" routerLinkActive="active">About</a>
      <a mat-list-item routerLink="/services" routerLinkActive="active"
        >Services</a
      >
      <a mat-list-item routerLink="/projects" routerLinkActive="active"
        >Projects</a
      >
      <a mat-list-item routerLink="/locations" routerLinkActive="active"
        >Locations</a
      >
      <a mat-list-item routerLink="/solar-calculator" routerLinkActive="active"
        >Solar Calculator</a
      >
      <a mat-list-item routerLink="/testimonials" routerLinkActive="active"
        >Testimonials</a
      >
      <a mat-list-item routerLink="/blog" routerLinkActive="active">Blog</a>
      <a mat-list-item routerLink="/contact" routerLinkActive="active"
        >Contact</a
      >
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active"
        >Dashboard</a
      >
      <a mat-list-item routerLink="/admin" routerLinkActive="active">Admin</a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="sidenav-content">
    <button type="button" (click)="sidenav.toggle()" class="mobile-toggle">
      <mat-icon>menu</mat-icon>
    </button>
  </mat-sidenav-content>
</mat-sidenav-container>
